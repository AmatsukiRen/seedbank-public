name: Offline regressions (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.14'
      - name: Install pinned dependencies
        run: python -m pip install -r packaging/requirements-windows.lock
      - name: Core
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/run_offline.ps1 -Suite core
      - name: Integrations
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/run_offline.ps1 -Suite integrations
      - name: Plugins
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/run_offline.ps1 -Suite plugins
      - name: QQ security and privacy
        run: powershell -NoProfile -ExecutionPolicy Bypass -File packaging/run_offline.ps1 -Suite security
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: offline-logs
          path: artifacts/offline-*.log
          retention-days: 7
